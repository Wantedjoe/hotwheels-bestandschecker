name: Hot Wheels Bestandscheck

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Verhindert, dass zwei Läufe gleichzeitig
# dieselben Dateien bearbeiten.
concurrency:
  group: hot-wheels-check
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Statusdateien vorbereiten
        run: |
          [ -f status.txt ] || echo "active" > status.txt
          [ -f stock.txt ] || printf "unknown\nunknown\nunknown\n" > stock.txt
          [ -f telegram_offset.txt ] || echo "0" > telegram_offset.txt
          [ -f urls.txt ] || touch urls.txt

      - name: Bestandsprüfung
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py

      - name: Status speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.txt stock.txt telegram_offset.txt urls.txt

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "Update bot and stock status"

          git pull --rebase origin main

          git push
