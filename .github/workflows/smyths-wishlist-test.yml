name: Smyths Wunschliste Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wishlist-test:

    runs-on: ubuntu-latest

    steps:

      - name: Repository herunterladen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Smyths Wunschliste testen
        run: |
          python smyths_wishlist_test.py

      - name: Diagnose-Dateien hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smyths-wishlist-diagnose
          path: |
            smyths_wishlist.png
            smyths_wishlist.html
          if-no-files-found: warn
