name: Smyths Diagnose Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-smyths:
    runs-on: ubuntu-latest

    steps:

      - name: Repository herunterladen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Smyths Diagnose durchführen
        run: |
          python smyths_test2.py

      - name: Diagnose-Dateien hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smyths-diagnose
          path: |
            smyths_page.png
            smyths_page.html
          if-no-files-found: warn
